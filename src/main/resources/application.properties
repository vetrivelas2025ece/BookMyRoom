spring.application.name=bookmyroom

# Set DB_PASSWORD in your environment before starting the application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmyroom}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Development only; use database migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}
